<!doctype html><html><head><meta charset="utf-8"><title>SteelThreads marks</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@500;600&display=swap">
<style>
body{margin:0;font-family:Geist,system-ui,sans-serif;background:#F4F2EC;color:#14161A}
.row{display:grid;grid-template-columns:1fr 1fr;min-height:300px}
.row>div{padding:40px 56px;display:flex;flex-direction:column;gap:22px}
.dark{background:#14161A;color:#F4F2EC}
.dark svg [fill="#14161A"]{fill:#F4F2EC}.dark svg [stroke="#14161A"]{stroke:#F4F2EC}.dark svg [fill="#F4F2EC"]{fill:#14161A}.dark svg [stroke="#F4F2EC"]{stroke:#14161A}
h2{margin:0;font:500 14px/1 'Geist Mono',ui-monospace,monospace;letter-spacing:.12em;text-transform:uppercase;opacity:.55}
.lock{display:flex;align-items:center;gap:14px;font-weight:600;font-size:30px;letter-spacing:-.03em}
.lock svg{width:44px;height:44px}
.lock b{font-weight:600}.lock em{font-style:normal;color:#0E6B57}.dark .lock em{color:#4FB39A}
.sizes{display:flex;align-items:flex-end;gap:28px}
.sizes span{display:flex;flex-direction:column;align-items:center;gap:8px;font:12px 'Geist Mono',monospace;opacity:.6}
.fav{width:32px;height:32px;border-radius:7px;background:#0E6B57;display:grid;place-items:center}
.fav svg{width:24px;height:24px}.fav svg [fill="#14161A"]{fill:#F4F2EC}.fav svg [stroke="#14161A"]{stroke:#F4F2EC}
.fav svg [stroke="#0E6B57"]{stroke:#F4F2EC}.fav svg [fill="#0E6B57"]{fill:#F4F2EC}.fav svg [fill="#F4F2EC"]{fill:#0E6B57}.fav svg [stroke="#F4F2EC"]{stroke:#0E6B57}
</style></head><body>
<script>
const C=[['H1 · A straight answer through the tangle','h1-tangle.svg'],['H2 · Outgrew the system','h2-outgrown.svg'],['H3 · Spreadsheet maze → one system','h3-spreadsheet.svg'],['H4 · Systems that talk to each other','h4-two-systems.svg'],['H6 · Straight answers','h6-question.svg'],['G1 · One thread of execution through the code','g1-code-thread.svg']];
(async()=>{for(const [name,file] of C){const svg=await (await fetch(file)).text();
const block=(cls)=>`<div class="${cls}"><h2>${name}</h2>
<div class="lock">${svg}<span><b>Steel</b><em>Threads</em></span></div>
<div class="sizes"><span>${svg.replace('<svg','<svg width=96 height=96')}96</span><span>${svg.replace('<svg','<svg width=48 height=48')}48</span><span>${svg.replace('<svg','<svg width=24 height=24')}24</span><span>${svg.replace('<svg','<svg width=16 height=16')}16</span><span><i class="fav">${svg}</i>favicon</span></div></div>`;
document.body.insertAdjacentHTML('beforeend',`<div class="row">${block('')}${block('dark')}</div>`)}})();
</script></body></html>
